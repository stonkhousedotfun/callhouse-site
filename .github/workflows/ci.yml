name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  site:
    name: site (install, typecheck, lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` input: pnpm/action-setup reads `packageManager` from package.json, so CI runs
      # the same pnpm (9.10.0) that wrote pnpm-lock.yaml. Naming a version here as well is an error.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm typecheck
      - name: lint
        run: pnpm lint
      - name: test
        run: pnpm test
      - name: build
        run: pnpm build
