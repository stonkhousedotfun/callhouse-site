title = "Stonkhouse site: default Gitleaks rules with one public-address exception"

[extend]
useDefault = true

# The generic API-key heuristic can match a public, 20-byte EVM address.
# This exact shape cannot match a 32-byte EVM private key. Other rules remain.
[[allowlists]]
description = "Exact 20-byte EVM address under generic-api-key only"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^lib/site\.ts$''']
regexes = ['''^0x[0-9a-fA-F]{40}$''']
